
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUSSEF AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <h2>⚡ YOUSSEF AI</h2>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
    <h4>AI TOOLS</h4>
    <button onclick="setMode('chat')">💬 AI Chat</button>
    <button onclick="setMode('code')">💻 Coding AI</button>
    <button onclick="setMode('cyber')">🛡 Cyber AI</button>
    <button onclick="setMode('image')">🖼 Image AI</button>
    <div class="sidebar-bottom">Powered by Youssef</div>
  </aside>

  <main class="main">
    <header>
      <span>YOUSSEF AI</span>
      <span class="status">● AI PLATFORM</span>
    </header>

    <section class="welcome" id="welcome">
      <h1>Your AI. Your World.</h1>
      <p>What would you like to create today?</p>
    </section>

    <section id="messages" class="messages"></section>

    <div class="input-area">
      <textarea id="prompt" placeholder="Ask Youssef AI anything..."></textarea>
      <button onclick="sendMessage()">➤</button>
    </div>

    <p class="disclaimer">AI can make mistakes. Always verify important information.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
